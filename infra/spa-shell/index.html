<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10251e" />
    <title>Manager Sonnia | Phase 1</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10251e;
        color: #ecf7ef;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 10% 10%, #2f6d55 0, transparent 34rem),
          radial-gradient(circle at 85% 85%, #163d31 0, transparent 30rem),
          #10251e;
      }
      main {
        width: min(42rem, calc(100% - 3rem));
        padding: clamp(2rem, 6vw, 4.5rem);
        border: 1px solid rgba(236, 247, 239, .18);
        border-radius: 1.5rem;
        background: rgba(8, 28, 20, .76);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, .34);
      }
      .eyebrow {
        margin: 0 0 1rem;
        color: #9ee1ba;
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 4.5rem);
        letter-spacing: -.05em;
        line-height: .95;
      }
      p {
        max-width: 38rem;
        color: #c6ddcd;
        font-size: 1.08rem;
        line-height: 1.65;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: .55rem;
        margin-top: 1rem;
        padding: .6rem .85rem;
        border: 1px solid rgba(158, 225, 186, .34);
        border-radius: 999px;
        color: #dff8e7;
        background: rgba(24, 93, 59, .35);
        font-size: .92rem;
        font-weight: 650;
      }
      .dot {
        width: .6rem;
        height: .6rem;
        border-radius: 50%;
        background: #9ee1ba;
        box-shadow: 0 0 0 .22rem rgba(158, 225, 186, .15);
      }
      .status[data-state="checking"] .dot { background: #f7d478; }
      .status[data-state="offline"] {
        color: #ffe1e1;
        border-color: rgba(255, 164, 164, .42);
        background: rgba(116, 36, 36, .35);
      }
      .status[data-state="offline"] .dot { background: #ff9e9e; }
      footer {
        margin-top: 3rem;
        color: #90ad9b;
        font-size: .84rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">manager.sonnia.ai</p>
      <h1>Phase 1 is online.</h1>
      <p>
        The Manager Sonnia service is connected securely to its private runtime.
        The founder demo workspace is being prepared for its next product build.
      </p>
      <div class="status" id="api-status" data-state="checking" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span>Checking service</span>
      </div>
      <footer>Recordings and transcripts remain private and are never served from this static site.</footer>
    </main>
    <script>
      (async () => {
        const status = document.getElementById("api-status");
        const label = status.querySelector("span:last-child");
        try {
          const response = await fetch("/healthz", { cache: "no-store" });
          if (!response.ok) throw new Error("health check failed");
          status.dataset.state = "online";
          label.textContent = "Service online";
        } catch {
          status.dataset.state = "offline";
          label.textContent = "Service temporarily unavailable";
        }
      })();
    </script>
  </body>
</html>
