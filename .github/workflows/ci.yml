name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - run: npm ci --include=dev
      - run: npm run test:rls
      - run: npm run test:feature-data
      - run: PYTHON=python npm run test:e2e
      - run: PYTHON=python npm run test:telnyx-ingestion
      - run: PYTHON=python npm run test:demo-seed
      - run: docker build --tag manager-sonnia-api:ci .
